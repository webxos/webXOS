<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEMPEST 2k26 · webXOS 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --holo-bg: #000000;
      --holo-cyan: #00FFFF;
      --holo-yellow: #FFFF00;
      --holo-red: #FF0000;
      --holo-green: #00FF00;
      --holo-magenta: #FF00FF;
      --holo-white: #FFFFFF;
      --holo-panel-bg: rgba(0, 0, 0, 0.75);
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Rajdhani', sans-serif; }
    
    body { 
      background: #050505; 
      color: var(--holo-cyan); 
      height: 100vh; 
      overflow: hidden; 
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CRT Scanlines and Vignette */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 30%, #000 100%);
      pointer-events: none;
      z-index: 9999;
    }
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0, 255, 255, 0.03) 0px, rgba(0, 255, 255, 0.03) 1px, transparent 1px, transparent 3px);
      pointer-events: none;
      z-index: 9998;
      mix-blend-mode: screen;
    }

    #gameContainer {
      width: 1200px;
      height: 600px;
      position: relative;
      background: var(--holo-bg);
      border: 2px solid var(--holo-cyan);
      box-shadow: 0 0 40px rgba(0, 255, 255, 0.2);
      overflow: hidden;
    }

    #gameContainer:fullscreen {
      width: 100vw;
      height: 100vh;
      border: none;
    }

    #gameCanvas { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 0; 
    }

    #screenFlash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: transparent;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: screen;
      transition: opacity 0.4s ease-out;
    }

    /* ---------- Holographic Neon Panels ---------- */
    .holo-panel {
      background: var(--holo-panel-bg);
      border: 1px solid var(--holo-cyan);
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      color: var(--holo-cyan);
      position: absolute;
      z-index: 20;
      pointer-events: all;
    }

    .holo-panel::before, .holo-panel::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border: 1px solid var(--holo-white);
      box-shadow: 0 0 6px var(--holo-cyan);
    }
    .holo-panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    .holo-panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

    /* ---------- AI Dashboard ---------- */
    #dashboard {
      top: 15px;
      right: 15px;
      width: 260px;
      padding: 15px;
    }

    #dashboard h2 {
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 900;
      color: var(--holo-white);
      text-shadow: 0 0 10px var(--holo-cyan);
      letter-spacing: 2px;
      border-bottom: 1px solid rgba(0, 255, 255, 0.3);
      padding-bottom: 5px;
    }

    .metric { display:flex; justify-content:space-between; margin: 4px 0; font-size: 12px; }
    .metric .label { color: var(--holo-cyan); text-transform: uppercase; opacity: 0.8; }
    .metric .value { color: var(--holo-white); font-family: 'Orbitron', sans-serif; font-size: 12px; }
    .metric .value.accent { color: var(--holo-green); }

    .slider-container { margin: 8px 0; position: relative; }
    .slider-container label { 
      display: flex; justify-content: space-between;
      margin-bottom: 4px; color: var(--holo-cyan); 
      font-size: 10px; text-transform: uppercase;
    }
    .slider-container label span {
      color: var(--holo-yellow); font-family: 'Orbitron', sans-serif;
    }
    
    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 2px;
      background: var(--holo-cyan); outline: none; opacity: 0.7;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 12px; height: 12px; background: var(--holo-bg);
      border: 1px solid var(--holo-white); cursor: pointer; transform: rotate(45deg);
    }

    /* ---------- Combat Stats (Top Left) ---------- */
    .combat-stats {
      top: 15px;
      left: 15px;
      padding: 10px;
      font-size: 11px;
      text-transform: uppercase;
      min-width: 180px;
    }
    .combat-stats div { margin: 4px 0; display: flex; justify-content: space-between; }
    .combat-stats span { color: var(--holo-white); font-family: 'Orbitron', sans-serif; }
    .bar-container { width: 100%; height: 3px; background: rgba(0, 255, 255, 0.1); margin-top: 2px; }
    .bar-fill { height: 100%; background: var(--holo-cyan); box-shadow: 0 0 8px var(--holo-cyan); transition: width 0.3s; }
    .shield-fill { background: var(--holo-green); box-shadow: 0 0 8px var(--holo-green); }

    /* ---------- Tape Deck Control Panel ---------- */
    .tape-deck {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--holo-cyan);
      padding: 8px 15px;
      border-radius: 4px;
      z-index: 30;
      box-shadow: 0 0 15px rgba(0,255,255,0.3);
      backdrop-filter: blur(4px);
    }

    .tape-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--holo-cyan);
      background: transparent;
      color: var(--holo-cyan);
      font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .tape-btn:hover { background: rgba(0,255,255,0.2); color: #fff; }
    .tape-btn.active { background: var(--holo-cyan); color: #000; box-shadow: 0 0 10px var(--holo-cyan); }
    .tape-btn.record { border-color: var(--holo-red); color: var(--holo-red); }
    .tape-btn.record:hover { background: rgba(255,0,0,0.2); }
    .tape-btn.fullscreen { border-color: var(--holo-yellow); color: var(--holo-yellow); }

    .holo-select {
      background: #000; color: var(--holo-cyan);
      border: 1px solid var(--holo-cyan);
      padding: 5px; font-family: 'Orbitron', sans-serif;
      font-size: 11px; outline: none; cursor: pointer;
    }

    .speed-control {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; width: 100px;
    }
    .speed-control label {
      font-size: 9px; color: var(--holo-cyan); 
      text-transform: uppercase; letter-spacing: 1px;
      display: flex; justify-content: space-between; width: 100%;
    }

    /* ---------- Main Menu ---------- */
    .main-menu {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .main-menu.hidden { display: none; }
    
    .game-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px; font-weight: 900;
      color: var(--holo-white);
      text-shadow: 0 0 20px var(--holo-cyan);
      letter-spacing: 8px; margin-bottom: 30px;
      border-bottom: 2px solid var(--holo-cyan);
      padding-bottom: 10px;
    }
    
    .menu-btn {
      width: 300px; padding: 12px;
      margin: 8px 0; border: 1px solid var(--holo-cyan);
      background: var(--holo-panel-bg); color: var(--holo-cyan);
      font-family: 'Orbitron', sans-serif; font-size: 13px;
      letter-spacing: 2px; text-align: center; cursor: pointer;
      transition: 0.2s;
      clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
    }
    .menu-btn:hover {
      background: rgba(0, 255, 255, 0.1); color: var(--holo-white);
      box-shadow: 0 0 20px var(--holo-cyan); transform: translateX(10px);
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="screenFlash"></div>

    <!-- Combat Stats -->
    <div class="combat-stats holo-panel">
      <div>LEVEL <span id="levelCount">1</span></div>
      <div>HOSTILES <span id="enemyCount">0</span></div>
      <div>SCORE <span id="combatScore">0</span></div>
      <div>HULL</div>
      <div class="bar-container"><div class="bar-fill" id="healthFill" style="width:100%"></div></div>
      <div>SHIELD</div>
      <div class="bar-container"><div class="bar-fill shield-fill" id="shieldFill" style="width:100%"></div></div>
    </div>

    <!-- AI Dashboard -->
    <div id="dashboard" class="holo-panel">
      <h2>by webXOS</h2>
      <div class="metric"><span class="label">Episode</span><span id="episodeVal" class="value">0</span></div>
      <div class="metric"><span class="label">Score</span><span id="scoreVal" class="value">0</span></div>
      <div class="metric"><span class="label">Steps</span><span id="stepsVal" class="value">0</span></div>
      <div class="metric"><span class="label">Reward</span><span id="rewardVal" class="value accent">0.00</span></div>
      <div class="metric"><span class="label">ε (explore)</span><span id="epsilonVal" class="value">0.20</span></div>
      
      <div class="slider-container">
        <label>α (learn) <span id="lrDisplay">0.10</span></label>
        <input type="range" id="lrSlider" min="0.01" max="0.5" step="0.01" value="0.1">
      </div>
      <div class="slider-container">
        <label>γ (discount) <span id="gammaDisplay">0.95</span></label>
        <input type="range" id="gammaSlider" min="0.5" max="0.99" step="0.01" value="0.95">
      </div>
    </div>

    <!-- Tape Deck Controls -->
    <div class="tape-deck">
      <button class="tape-btn" id="stopBtn" title="Stop / Reset">⏹</button>
      <button class="tape-btn active" id="playBtn" title="Play AI">▶</button>
      <button class="tape-btn" id="pauseBtn" title="Pause">⏸</button>
      
      <select id="levelSelect" class="holo-select" title="Free Mode Level Select"></select>
      
      <div class="speed-control">
        <label>TIME MOD <span id="timeDisplay">50ms</span></label>
        <input type="range" id="timeSlider" min="10" max="200" step="10" value="50">
      </div>

      <div class="speed-control">
        <label>FPS / FX <span id="fxDisplay">MAX</span></label>
        <input type="range" id="fxSlider" min="0" max="100" step="10" value="100">
      </div>
      
      <button class="tape-btn record" id="exportBtn" title="Export Logs">⏺</button>
      <button class="tape-btn fullscreen" id="fullscreenBtn" title="Fullscreen">⛶</button>
    </div>

    <!-- Main Menu -->
    <div class="main-menu" id="mainMenu">
      <h1 class="game-title">TEMPEST AI</h1>
      <div class="menu-btn" id="startBtn">DEFAULT MODE</div>
      <div class="menu-btn" id="freeModeBtn">FREE MODE (SELECT LEVEL)</div>
      <div class="menu-btn" id="exportModeBtn">EXPERT MODE (AI RUN 1-16)</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://unpkg.com/three@0.134.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://unpkg.com/three@0.134.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://unpkg.com/three@0.134.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://unpkg.com/three@0.134.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://unpkg.com/three@0.134.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://unpkg.com/three@0.134.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  
  <script>
    // ---------- THE 16 ORIGINAL TEMPEST SHAPE FACTORIES ----------
    const LevelGenerators = {
        1: { name: "1. Circle (Closed)", isClosed: true, func: () => {
            const pts = [];
            for(let i=0; i<16; i++) {
                let a = (i / 16) * Math.PI * 2;
                pts.push(new THREE.Vector2(Math.cos(a) * 60, Math.sin(a) * 60));
            }
            return pts;
        }},
        2: { name: "2. Square (Closed)", isClosed: true, func: () => {
            return [
                new THREE.Vector2(-50,50),  new THREE.Vector2(0,50),   new THREE.Vector2(50,50),
                new THREE.Vector2(50,0),   new THREE.Vector2(50,-50),  new THREE.Vector2(0,-50),
                new THREE.Vector2(-50,-50), new THREE.Vector2(-50,0)
            ];
        }},
        3: { name: "3. Plus Sign (Closed)", isClosed: true, func: () => {
            return [
                new THREE.Vector2(-20,50), new THREE.Vector2(20,50), new THREE.Vector2(20,20),
                new THREE.Vector2(50,20), new THREE.Vector2(50,-20), new THREE.Vector2(20,-20),
                new THREE.Vector2(20,-50), new THREE.Vector2(-20,-50), new THREE.Vector2(-20,-20),
                new THREE.Vector2(-50,-20), new THREE.Vector2(-50,20), new THREE.Vector2(-20,20)
            ];
        }},
        4: { name: "4. Infinity Loop (Closed)", isClosed: true, func: () => {
            const pts = [];
            for(let i=0; i<16; i++) {
                let t = (i / 16) * Math.PI * 2;
                let scale = 90 / (3 - Math.cos(2*t));
                pts.push(new THREE.Vector2(scale * Math.cos(t), scale * Math.sin(2*t) / 2));
            }
            return pts;
        }},
        5: { name: "5. Heart / Triangle (Closed)", isClosed: true, func: () => {
            return [
                new THREE.Vector2(0,25), new THREE.Vector2(25,50), new THREE.Vector2(50,15),
                new THREE.Vector2(25,-35), new THREE.Vector2(0,-60), new THREE.Vector2(-25,-35),
                new THREE.Vector2(-50,15), new THREE.Vector2(-25,50)
            ];
        }},
        6: { name: "6. V-Shape (Open)", isClosed: false, func: () => {
            return [
                new THREE.Vector2(-60,50), new THREE.Vector2(-40,15), new THREE.Vector2(-20,-20),
                new THREE.Vector2(0,-50), new THREE.Vector2(20,-20), new THREE.Vector2(40,15),
                new THREE.Vector2(60,50)
            ];
        }},
        7: { name: "7. Steps (Open)", isClosed: false, func: () => {
            return [
                new THREE.Vector2(-60,40), new THREE.Vector2(-40,40), new THREE.Vector2(-40,15),
                new THREE.Vector2(-20,15), new THREE.Vector2(-20,-10), new THREE.Vector2(20,-10),
                new THREE.Vector2(20,15), new THREE.Vector2(40,15), new THREE.Vector2(40,40),
                new THREE.Vector2(60,40)
            ];
        }},
        8: { name: "8. U-Shape (Open)", isClosed: false, func: () => {
            return [
                new THREE.Vector2(-50,50), new THREE.Vector2(-50,10), new THREE.Vector2(-50,-30),
                new THREE.Vector2(-25,-30), new THREE.Vector2(0,-30), new THREE.Vector2(25,-30),
                new THREE.Vector2(50,-30), new THREE.Vector2(50,10), new THREE.Vector2(50,50)
            ];
        }},
        9: { name: "9. Flat Line (Open)", isClosed: false, func: () => {
            const pts = [];
            for(let i=0; i<=10; i++) {
                pts.push(new THREE.Vector2(-75 + (i * 15), -20));
            }
            return pts;
        }},
        10: { name: "10. Wave / Zig-Zag (Open)", isClosed: false, func: () => {
            return [
                new THREE.Vector2(-70,20), new THREE.Vector2(-50,-20), new THREE.Vector2(-30,20),
                new THREE.Vector2(-10,-20), new THREE.Vector2(10,20), new THREE.Vector2(30,-20),
                new THREE.Vector2(50,20), new THREE.Vector2(70,-20)
            ];
        }},
        11: { name: "11. Open Infinity (Open)", isClosed: false, func: () => {
            const pts = [];
            for(let i=1; i<15; i++) {
                let t = (i / 16) * Math.PI * 2;
                let scale = 95 / (3 - Math.cos(2*t));
                pts.push(new THREE.Vector2(scale * Math.cos(t), scale * Math.sin(2*t) * 0.6));
            }
            return pts;
        }},
        12: { name: "12. Clover / Flower (Closed)", isClosed: true, func: () => {
            const pts = [];
            for(let i=0; i<20; i++) {
                let a = (i / 20) * Math.PI * 2;
                let r = 40 + 20 * Math.cos(4 * a);
                pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
            }
            return pts;
        }},
        13: { name: "13. W-Shape (Open)", isClosed: false, func: () => {
            return [
                new THREE.Vector2(-60,40), new THREE.Vector2(-40,-20), new THREE.Vector2(-20,-40),
                new THREE.Vector2(0,10), new THREE.Vector2(20,-40), new THREE.Vector2(40,-20),
                new THREE.Vector2(60,40)
            ];
        }},
        14: { name: "14. Fan / Arch (Open)", isClosed: false, func: () => {
            const pts = [];
            for(let i=0; i<=10; i++) {
                let a = Math.PI + (i / 10) * Math.PI;
                pts.push(new THREE.Vector2(Math.cos(a) * 65, -Math.sin(a) * 45 - 20));
            }
            return pts;
        }},
        15: { name: "15. Intersecting Cross (Closed)", isClosed: true, func: () => {
            return [
                new THREE.Vector2(0,60), new THREE.Vector2(15,15), new THREE.Vector2(60,0),
                new THREE.Vector2(15,-15), new THREE.Vector2(0,-60), new THREE.Vector2(-15,-15),
                new THREE.Vector2(-60,0), new THREE.Vector2(-15,15)
            ];
        }},
        16: { name: "16. Spiral (Open)", isClosed: false, func: () => {
            const pts = [];
            for(let i=0; i<16; i++) {
                let a = (i / 5) * Math.PI;
                let r = 70 - (i * 3.2);
                pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
            }
            return pts;
        }}
    };

    // ---------- MAIN THREAD (RENDERING) ----------
    let scene, camera, renderer, composer;
    let player, playerWireframe, playerCore, playerMeshMat, playerCoreMat, playerWireframeMat;
    let enemies = [], projectiles = [];
    let clock = new THREE.Clock();
    let dustParticles;
    let currentMesh = null;
    const TUNNEL_DEPTH = 400;

    let displayStats = { episode:0, score:0, steps:0, reward:0, epsilon:0.2, health:100, shield:100, level:1 };
    let playerSegmentTarget = 0;
    let playerSegmentCurrent = 0;
    let currentLevelPoints = [];
    let currentLevelConfig = null;
    let currentRenderedLevel = 0;

    let activeVFX = [];
    let cameraShakeIntensity = 0;
    let cameraShakeDuration = 0;
    let prevHealth = 100, prevShield = 100;
    const flashEl = document.getElementById('screenFlash');
    const gameContainer = document.getElementById('gameContainer');

    // Input State
    let keys = { left: false, right: false, fire: false };

    // Visual Settings State
    let fxLevel = 1.0; // 0.0 (Minimal) to 1.0 (Max)
    let useBloom = true;

    // Colors
    const COL_VOID = 0x000000;
    const COL_CYAN = 0x00FFFF;
    const COL_YELLOW = 0xFFFF00;
    const COL_RED = 0xFF0000;
    const COL_GREEN = 0x00FF00;
    const COL_WHITE = 0xFFFFFF;
    const COL_BLUE = 0x0000FF;
    const COL_MAGENTA = 0xFF00FF;

    // Generate Soft Glowing Particle Texture
    function createParticleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.2, 'rgba(255,255,255,0.85)');
      gradient.addColorStop(0.5, 'rgba(255,255,255,0.3)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }
    const particleTexture = createParticleTexture();

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(COL_VOID);
      scene.fog = new THREE.Fog(COL_VOID, 150, 450);
      
      camera = new THREE.PerspectiveCamera(60, 1200/600, 1, 2000);
      camera.position.set(0, 50, 180);
      camera.lookAt(0, 0, -100);
      
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
      renderer.setSize(1200, 600);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Safe Post-Processing Setup
      try {
        composer = new THREE.EffectComposer(renderer);
        composer.addPass(new THREE.RenderPass(scene, camera));
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(1200, 600), 1.2, 0.5, 0.0);
        composer.addPass(bloomPass);
      } catch (e) {
        console.warn("Bloom initialization failed, falling back to standard rendering.", e);
        useBloom = false;
      }
      
      const ambient = new THREE.AmbientLight(0x222222); 
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xFFFFFF, 0.4);
      dirLight.position.set(5, 10, 5);
      scene.add(dirLight);

      createHoloEnvironment();
      createPlayerShip();
      
      window.addEventListener('resize', resizeRenderer);
      document.addEventListener('fullscreenchange', resizeRenderer);
      
      // Default to level 1
      changeLevel(1, 1);
    }

    function resizeRenderer() {
      const w = gameContainer.clientWidth;
      const h = gameContainer.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      if (useBloom && composer) composer.setSize(w, h);
    }

    function createHoloEnvironment() {
      const gridHelper = new THREE.GridHelper(1000, 100, COL_CYAN, COL_CYAN);
      gridHelper.material.opacity = 0.1;
      gridHelper.material.transparent = true;
      gridHelper.position.y = -100;
      scene.add(gridHelper);

      const dustGeo = new THREE.BufferGeometry();
      const dustMat = new THREE.PointsMaterial({ color: COL_CYAN, size: 0.5, transparent: true, opacity: 0.4, sizeAttenuation: true });
      const dustVerts = [];
      for(let i=0; i<1000; i++) {
        dustVerts.push((Math.random() - 0.5) * 400, (Math.random() - 0.5) * 300, (Math.random() - 0.5) * 500 - 100);
      }
      dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustVerts, 3));
      dustParticles = new THREE.Points(dustGeo, dustMat);
      scene.add(dustParticles);
    }

    function createPlayerShip() {
      player = new THREE.Group();
      const shape = new THREE.Shape();
      shape.moveTo(0, 12); shape.lineTo(-5, 3); shape.lineTo(-2, 3); shape.lineTo(-8, -8);
      shape.lineTo(-1, -1); shape.lineTo(0, -4); shape.lineTo(1, -1); shape.lineTo(8, -8);
      shape.lineTo(2, 3); shape.lineTo(5, 3); shape.lineTo(0, 12); shape.closePath();        

      const extrudeSettings = { depth: 3, bevelEnabled: true, bevelSegments: 1, steps: 1, bevelSize: 1, bevelThickness: 1 };
      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.center();
      geo.rotateX(-Math.PI / 2); 

      playerMeshMat = new THREE.MeshBasicMaterial({ color: COL_YELLOW, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
      player.add(new THREE.Mesh(geo, playerMeshMat));

      const edges = new THREE.EdgesGeometry(geo);
      playerWireframeMat = new THREE.LineBasicMaterial({ color: COL_WHITE, linewidth: 2 });
      playerWireframe = new THREE.LineSegments(edges, playerWireframeMat);
      player.add(playerWireframe);

      const coreGeo = new THREE.ConeGeometry(1.5, 5, 4);
      playerCoreMat = new THREE.MeshBasicMaterial({ color: COL_YELLOW, transparent: true, opacity: 0.9 });
      playerCore = new THREE.Mesh(coreGeo, playerCoreMat);
      playerCore.rotation.x = -Math.PI / 2;
      playerCore.position.z = -6; 
      player.add(playerCore);

      scene.add(player);
    }

    function getLevelColor(level) {
      if (level >= 65 && level <= 80) return { tunnel: COL_VOID, player: COL_YELLOW, opacity: 0.05 };
      if (level >= 81) return { tunnel: COL_GREEN, player: COL_YELLOW, opacity: 1.0 };
      if (level >= 49 && level <= 64) return { tunnel: 0x0088FF, player: COL_YELLOW, opacity: 1.0 };
      if (level >= 33 && level <= 48) return { tunnel: COL_YELLOW, player: COL_BLUE, opacity: 1.0 };
      if (level >= 17 && level <= 32) return { tunnel: COL_RED, player: COL_YELLOW, opacity: 1.0 };
      return { tunnel: COL_CYAN, player: COL_YELLOW, opacity: 1.0 };
    }

    function buildTempestTunnel(config) {
      const basePoints = config.func();
      currentLevelPoints = basePoints;
      const segments = basePoints.length;
      const linePositions = [];

      for (let i = 0; i < segments; i++) {
          let nextIdx = (i + 1) % segments;
          let pFrontCurrent = new THREE.Vector3(basePoints[i].x, basePoints[i].y, 0);
          let pFrontNext    = new THREE.Vector3(basePoints[nextIdx].x, basePoints[nextIdx].y, 0);
          let pBackCurrent  = new THREE.Vector3(basePoints[i].x * 0.15, basePoints[i].y * 0.15, -TUNNEL_DEPTH);
          let pBackNext     = new THREE.Vector3(basePoints[nextIdx].x * 0.15, basePoints[nextIdx].y * 0.15, -TUNNEL_DEPTH);

          if (config.isClosed || i < segments - 1) {
              linePositions.push(pFrontCurrent.x, pFrontCurrent.y, pFrontCurrent.z, pFrontNext.x, pFrontNext.y, pFrontNext.z);
              linePositions.push(pBackCurrent.x, pBackCurrent.y, pBackCurrent.z, pBackNext.x, pBackNext.y, pBackNext.z);
          }
          linePositions.push(pFrontCurrent.x, pFrontCurrent.y, pFrontCurrent.z, pBackCurrent.x, pBackCurrent.y, pBackCurrent.z);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
      const material = new THREE.LineBasicMaterial({ color: COL_CYAN, linewidth: 2, transparent: true });
      return new THREE.LineSegments(geometry, material);
    }

    function changeLevel(shapeId, levelNum) {
      if (currentMesh) {
        disposeObject(currentMesh);
        scene.remove(currentMesh);
      }
      currentLevelConfig = LevelGenerators[shapeId];
      currentMesh = buildTempestTunnel(currentLevelConfig);
      scene.add(currentMesh);
      
      const colors = getLevelColor(levelNum);
      currentMesh.material.color.setHex(colors.tunnel);
      currentMesh.material.opacity = colors.opacity;
      
      playerMeshMat.color.setHex(colors.player);
      playerCoreMat.color.setHex(colors.player);
      playerWireframeMat.color.setHex(colors.player === COL_BLUE ? COL_WHITE : COL_YELLOW);
      
      worker.postMessage({ cmd: 'setLevel', segments: currentLevelPoints.length, isClosed: currentLevelConfig.isClosed });
      
      playerSegmentTarget = 0;
      playerSegmentCurrent = 0;
      currentRenderedLevel = levelNum;
    }

    function getTubePosition(segmentIndex, depth) {
      const segments = currentLevelPoints.length;
      let idx = Math.floor(segmentIndex);
      let frac = segmentIndex - idx;
      
      if (currentLevelConfig.isClosed) {
        idx = ((idx % segments) + segments) % segments;
        let nextIdx = (idx + 1) % segments;
        let p1 = currentLevelPoints[idx];
        let p2 = currentLevelPoints[nextIdx];
        let x = p1.x + (p2.x - p1.x) * frac;
        let y = p1.y + (p2.y - p1.y) * frac;
        let t = Math.max(0, Math.min(1, -depth / TUNNEL_DEPTH));
        let scale = 1.0 - t * 0.85;
        return new THREE.Vector3(x * scale, y * scale, depth);
      } else {
        idx = Math.max(0, Math.min(segments - 1, idx));
        let nextIdx = Math.max(0, Math.min(segments - 1, idx + 1));
        let p1 = currentLevelPoints[idx];
        let p2 = currentLevelPoints[nextIdx];
        let x = p1.x + (p2.x - p1.x) * frac;
        let y = p1.y + (p2.y - p1.y) * frac;
        let t = Math.max(0, Math.min(1, -depth / TUNNEL_DEPTH));
        let scale = 1.0 - t * 0.85;
        return new THREE.Vector3(x * scale, y * scale, depth);
      }
    }

    function createEnemyMesh(segment, depth, type) {
      let geo, color;
      if (type === 2) { // Spike
        geo = new THREE.ConeGeometry(5, 12, 4);
        color = COL_MAGENTA;
      } else {
        geo = new THREE.OctahedronGeometry(6);
        color = type % 2 === 0 ? COL_RED : COL_GREEN;
      }
      
      const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.8 });
      const mesh = new THREE.Mesh(geo, mat);
      
      const edges = new THREE.EdgesGeometry(geo);
      const lineMat = new THREE.LineBasicMaterial({ color: COL_WHITE });
      mesh.add(new THREE.LineSegments(edges, lineMat));

      const pos = getTubePosition(segment, depth);
      mesh.position.copy(pos);
      mesh.rotation.x = Math.random() * Math.PI;
      mesh.rotation.y = Math.random() * Math.PI;
      scene.add(mesh);
      return mesh;
    }

    function createProjectileMesh(segment, depth) {
      const geo = new THREE.CylinderGeometry(1.5, 1.5, 12, 4);
      const mat = new THREE.MeshBasicMaterial({ color: COL_WHITE, transparent: true, opacity: 0.8 });
      const mesh = new THREE.Mesh(geo, mat);
      
      const edges = new THREE.EdgesGeometry(geo);
      const lineMat = new THREE.LineBasicMaterial({ color: COL_YELLOW });
      mesh.add(new THREE.LineSegments(edges, lineMat));

      const pos = getTubePosition(segment, depth);
      mesh.position.copy(pos);
      mesh.rotation.x = Math.PI / 2; 
      scene.add(mesh);
      return mesh;
    }

    function disposeObject(obj) {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
      if (obj.children) {
        obj.children.slice().forEach(c => { disposeObject(c); obj.remove(c); });
      }
    }

    // ==========================================
    // VFX SYSTEM (DYNAMICALLY SCALED BY fxLevel)
    // ==========================================
    class VFXEffect {
      constructor(x, y, z, color, scale = 1, type = 'explosion') {
        this.group = new THREE.Group();
        this.group.position.set(x, y, z);
        this.life = 1.0;
        
        // Use Math.max to ensure scale never hits exactly 0, preventing NaN geometry issues
        this.scale = Math.max(0.1, scale * fxLevel); 
        this.color = new THREE.Color(color);
        this.type = type;
        this.isAlive = true;

        if (this.type === 'explosion') {
          const coreGeo = new THREE.IcosahedronGeometry(2 * this.scale, 0);
          this.coreMat = new THREE.MeshBasicMaterial({ color: COL_WHITE, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending });
          this.core = new THREE.Mesh(coreGeo, this.coreMat);
          this.group.add(this.core);

          // Only spawn ring if fxLevel is high enough to save draw calls
          if (fxLevel > 0.3) {
            const ringGeo = new THREE.RingGeometry(1, 1.5, 32);
            this.ringMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.8, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
            this.ring = new THREE.Mesh(ringGeo, this.ringMat);
            this.group.add(this.ring);
          }

          // Particle counts are directly scaled by fxLevel
          this.debrisCount = Math.max(1, Math.floor(60 * this.scale));
          const debrisGeo = new THREE.BufferGeometry();
          this.debrisPos = new Float32Array(this.debrisCount * 3);
          this.debrisVel = [];
          const debrisColors = new Float32Array(this.debrisCount * 3);
          const cWhite = new THREE.Color(COL_WHITE);
          const cAccent = new THREE.Color(COL_MAGENTA);
          
          for (let i = 0; i < this.debrisCount; i++) {
            this.debrisPos[i * 3] = 0; this.debrisPos[i * 3 + 1] = 0; this.debrisPos[i * 3 + 2] = 0;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const speed = (Math.random() * 0.8 + 0.2) * 60 * this.scale;
            this.debrisVel.push(new THREE.Vector3(Math.sin(phi) * Math.cos(theta) * speed, Math.sin(phi) * Math.sin(theta) * speed, Math.cos(phi) * speed));
            const mix = Math.random();
            const col = mix < 0.3 ? cWhite : (mix < 0.8 ? this.color : cAccent);
            debrisColors[i * 3] = col.r; debrisColors[i * 3 + 1] = col.g; debrisColors[i * 3 + 2] = col.b;
          }
          debrisGeo.setAttribute('position', new THREE.BufferAttribute(this.debrisPos, 3));
          debrisGeo.setAttribute('color', new THREE.BufferAttribute(debrisColors, 3));
          this.debrisMat = new THREE.PointsMaterial({ size: 5 * this.scale, map: particleTexture, vertexColors: true, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
          this.debris = new THREE.Points(debrisGeo, this.debrisMat);
          this.group.add(this.debris);

          // Only spawn sparks if fxLevel is high enough
          if (fxLevel > 0.5) {
            this.sparkCount = Math.max(1, Math.floor(30 * this.scale));
            const sparkGeo = new THREE.BufferGeometry();
            this.sparkPos = new Float32Array(this.sparkCount * 3);
            this.sparkVel = [];
            for (let i = 0; i < this.sparkCount; i++) {
              this.sparkPos[i * 3] = 0; this.sparkPos[i * 3 + 1] = 0; this.sparkPos[i * 3 + 2] = 0;
              const theta = Math.random() * Math.PI * 2;
              const phi = Math.acos(2 * Math.random() - 1);
              const speed = (Math.random() * 0.2 + 0.05) * 20 * this.scale;
              this.sparkVel.push(new THREE.Vector3(Math.sin(phi) * Math.cos(theta) * speed, Math.sin(phi) * Math.sin(theta) * speed, Math.cos(phi) * speed));
            }
            sparkGeo.setAttribute('position', new THREE.BufferAttribute(this.sparkPos, 3));
            this.sparkMat = new THREE.PointsMaterial({ size: 3 * this.scale, map: particleTexture, color: COL_WHITE, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
            this.sparks = new THREE.Points(sparkGeo, this.sparkMat);
            this.group.add(this.sparks);
          }
        } else if (this.type === 'trail') {
          this.trailGeo = new THREE.BufferGeometry();
          this.trailPos = new Float32Array([0, 0, 0]);
          this.trailGeo.setAttribute('position', new THREE.BufferAttribute(this.trailPos, 3));
          this.trailMat = new THREE.PointsMaterial({ size: 4 * this.scale, map: particleTexture, color: color, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
          this.trail = new THREE.Points(this.trailGeo, this.trailMat);
          this.group.add(this.trail);
          this.life = 0.6;
        }
        scene.add(this.group);
      }

      update(dt) {
        // FIX: Robust check to prevent crash if group was never initialized
        if (!this.group) { this.isAlive = false; return; }
        
        this.life -= dt * (this.type === 'trail' ? 2.0 : 1.5);
        if (this.life <= 0) { this.destroy(); return; }
        const t = 1.0 - this.life;

        if (this.type === 'explosion') {
          if (this.core) {
            this.core.scale.setScalar(1 + t * 6 * this.scale);
            this.coreMat.opacity = Math.max(0, 1 - t * 3);
          }
          if (this.ring) {
            this.ring.scale.setScalar(1 + t * 20 * this.scale);
            this.ringMat.opacity = Math.max(0, 0.8 - t * 1.2);
            this.ring.lookAt(camera.position);
          }
          if (this.debris) {
            const posAttr = this.debris.geometry.attributes.position;
            for (let i = 0; i < this.debrisCount; i++) {
              this.debrisVel[i].multiplyScalar(0.95);
              this.debrisPos[i * 3] += this.debrisVel[i].x * dt;
              this.debrisPos[i * 3 + 1] += this.debrisVel[i].y * dt;
              this.debrisPos[i * 3 + 2] += this.debrisVel[i].z * dt;
            }
            posAttr.needsUpdate = true;
            this.debrisMat.opacity = Math.max(0, 1 - t * 1.2);
            this.debrisMat.size = Math.max(0.1, (5 * this.scale) * (1 - t * 0.5));
          }
          if (this.sparks) {
            const sparkAttr = this.sparks.geometry.attributes.position;
            for (let i = 0; i < this.sparkCount; i++) {
              this.sparkVel[i].multiplyScalar(0.98);
              this.sparkPos[i * 3] += this.sparkVel[i].x * dt;
              this.sparkPos[i * 3 + 1] += this.sparkVel[i].y * dt;
              this.sparkPos[i * 3 + 2] += this.sparkVel[i].z * dt;
            }
            sparkAttr.needsUpdate = true;
            this.sparkMat.opacity = Math.max(0, 0.9 - t * 0.8);
          }
        } else if (this.type === 'trail') {
          if (this.trail) {
            this.trailMat.opacity = Math.max(0, 0.8 - t * 1.5);
          }
        }
      }

      destroy() {
        this.isAlive = false;
        if (!this.group) return;
        scene.remove(this.group);
        if (this.core) { this.core.geometry.dispose(); this.coreMat.dispose(); }
        if (this.ring) { this.ring.geometry.dispose(); this.ringMat.dispose(); }
        if (this.debris) { this.debris.geometry.dispose(); this.debrisMat.dispose(); }
        if (this.sparks) { this.sparks.geometry.dispose(); this.sparkMat.dispose(); }
        if (this.trail) { this.trail.geometry.dispose(); this.trailMat.dispose(); }
      }
    }

    function spawnVFX(x, y, z, color, scale = 1, type = 'explosion') {
      // FIX: Prevent spawning broken objects if fxLevel is 0, avoiding crash loop entirely
      if (fxLevel <= 0.0) return;
      // Don't spawn trails if FX is below 0.5 to save frame rate
      if (type === 'trail' && fxLevel < 0.5) return;
      
      const vfx = new VFXEffect(x, y, z, color, scale, type);
      if (vfx.isAlive) activeVFX.push(vfx);
      
      if (type === 'explosion') {
        cameraShakeIntensity = Math.max(cameraShakeIntensity, 0.5 * scale * fxLevel);
        cameraShakeDuration = Math.max(cameraShakeDuration, 0.2 * scale * fxLevel);
        if (fxLevel > 0.1) {
          triggerScreenFlash(color, 0.4 * scale * fxLevel);
        }
      }
    }

    function triggerScreenFlash(color, intensity) {
      if (intensity <= 0) return;
      const hex = '#' + color.toString(16).padStart(6, '0');
      flashEl.style.background = hex;
      flashEl.style.transition = 'none';
      flashEl.style.opacity = intensity;
      void flashEl.offsetWidth; 
      flashEl.style.transition = 'opacity 0.4s ease-out';
      flashEl.style.opacity = '0';
    }

    // ---------- WEB WORKER (Q-LEARNING AI) ----------
    const workerCode = `
      let currentSegments = 16;
      let isClosed = true;
      const TUBE_DEPTH_MIN = -380; 
      const TUBE_DEPTH_MAX = 10;   
      
      let episode = 0, score = 0, steps = 0, done = false;
      let rewardSum = 0;
      let playerSegment = 0;
      let enemies = [];
      let projectiles = [];
      
      let alpha = 0.1, epsilon = 0.2, gamma = 0.95;
      let logs = [];
      
      let health = 100, shield = 100;
      let humanLeft = false, humanRight = false, humanFire = false;
      
      let level = 1;
      let episodeSuccess = false;
      let isFreeMode = false;
      let exportMode = false;
      let exportResults = [];
      let invulnTimer = 0;
      
      let Q = {};
      
      function maxQ(s) {
        if (!Q[s]) Q[s] = [0, 0, 0];
        return Math.max(Q[s][0], Q[s][1], Q[s][2]);
      }
      
      function chooseAction(s) {
        if (humanLeft) return 0;
        if (humanRight) return 1;
        if (humanFire) return 2;
        
        if (Math.random() < epsilon) return Math.floor(Math.random() * 3);
        if (!Q[s]) return Math.floor(Math.random() * 3);
        let arr = Q[s];
        if (arr[0] === arr[1] && arr[1] === arr[2]) return Math.floor(Math.random() * 3);
        let maxVal = Math.max(arr[0], arr[1], arr[2]);
        if (arr[0] === maxVal) return 0;
        if (arr[1] === maxVal) return 1;
        return 2;
      }
      
      function getState() {
        let closest = null;
        let minDist = Infinity;
        enemies.forEach(e => {
          let dist = Math.abs(e.depth);
          let diff = Math.abs(e.segment - playerSegment);
          let circDiff = isClosed ? Math.min(diff, currentSegments - diff) : diff;
          let totalDist = dist + circDiff * 2;
          if (totalDist < minDist) { minDist = totalDist; closest = e; }
        });
        if (!closest) return "none";
        let diff = closest.segment - playerSegment;
        if (isClosed) {
          if (diff < 0) diff += currentSegments;
          if (diff > currentSegments / 2) diff -= currentSegments;
        }
        let distBucket = Math.floor(closest.depth / 50);
        return playerSegment + "_" + Math.round(diff) + "_" + distBucket;
      }
      
      function step() {
        let s_old = getState();
        let reward = 0;
        let action = chooseAction(s_old);
        
        if (action === 0) {
          if (isClosed) playerSegment = (playerSegment - 1 + currentSegments) % currentSegments;
          else playerSegment = Math.max(0, Math.min(currentSegments - 1, playerSegment - 1));
        } else if (action === 1) {
          if (isClosed) playerSegment = (playerSegment + 1) % currentSegments;
          else playerSegment = Math.max(0, Math.min(currentSegments - 1, playerSegment + 1));
        } else if (action === 2) {
          projectiles.push({ segment: playerSegment, depth: TUBE_DEPTH_MAX - 10 });
          reward -= 0.05;
        }
        
        if (invulnTimer > 0) invulnTimer--;
        
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.depth += e.speed || 2.0;
          if (e.depth >= TUBE_DEPTH_MAX) {
            if (invulnTimer <= 0) {
              done = true;
              reward -= 15;
              if (shield > 0) shield = Math.max(0, shield - 25);
              else health = Math.max(0, health - 25);
              invulnTimer = 15; 
            }
            enemies.splice(i, 1);
          }
        }
        
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.depth -= 20.0;
          if (p.depth < TUBE_DEPTH_MIN) { projectiles.splice(i, 1); continue; }
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.abs(e.segment - p.segment) < 0.75 && Math.abs(e.depth - p.depth) < 15.0) {
              let pts = e.type === 2 ? 300 : 100;
              let rwd = e.type === 2 ? 30 : 10;
              enemies.splice(j, 1);
              projectiles.splice(i, 1);
              score += pts;
              reward += rwd;
              break;
            }
          }
        }
        
        if (enemies.length < 12 && Math.random() < 0.08) {
          let type = Math.random() < 0.15 ? 2 : Math.floor(Math.random() * 2);
          enemies.push({
            segment: Math.random() * currentSegments,
            depth: type === 2 ? TUBE_DEPTH_MIN - 50 : TUBE_DEPTH_MIN + Math.random() * 50,
            type: type,
            speed: type === 2 ? 1.0 : 2.0
          });
        }
        
        steps++;
        reward -= 0.02; 
        shield = Math.min(100, shield + 0.5); 
        
        if (health <= 0) done = true;
        if (steps > 600) done = true;
        if (enemies.length === 0 && steps > 50) {
            done = true;
            reward += 50;
            episodeSuccess = true;
        }
        
        let s_new = getState();
        if (!Q[s_old]) Q[s_old] = [0, 0, 0];
        let max_next = maxQ(s_new);
        Q[s_old][action] += alpha * (reward + gamma * max_next - Q[s_old][action]);
        
        if (Object.keys(Q).length > 5000) {
          const keys = Object.keys(Q);
          for (let i = 0; i < Math.floor(keys.length * 0.2); i++) delete Q[keys[i]];
        }
        
        rewardSum += reward;
        
        return {
          playerSegment,
          enemies: enemies.map(e => ({...e})),
          projectiles: projectiles.map(p => ({...p})),
          score, steps, rewardSum, episode, done, health, shield, level, invulnTimer
        };
      }
      
      function reset() {
        playerSegment = 0;
        enemies = [];
        projectiles = [];
        steps = 0;
        done = false;
        rewardSum = 0;
        health = 100;
        shield = 100;
        invulnTimer = 0;
        episode++;
        
        if (exportMode) {
          exportResults.push({ episode, level, score, success: episodeSuccess });
          if (episodeSuccess) {
            level++;
            if (level > 16) {
              self.postMessage({ type: 'export_done', results: exportResults });
              exportMode = false;
              exportResults = [];
              level = 1;
            }
          }
        } else if (!isFreeMode) {
          if (episodeSuccess) {
            level++;
            if (level > 99) level = 99;
          }
        }
        
        episodeSuccess = false;
        
        for (let i = 0; i < 5; i++) {
          enemies.push({
            segment: Math.random() * currentSegments,
            depth: TUBE_DEPTH_MIN + Math.random() * 100,
            type: Math.floor(Math.random() * 2)
          });
        }
      }
      reset();
      
      self.onmessage = function(e) {
        const data = e.data;
        if (data.cmd === 'step') {
          if (!done) {
            const state = step();
            self.postMessage({ type: 'state', ...state, epsilon });
          } else {
            reset();
            self.postMessage({
              type: 'state',
              playerSegment: 0,
              enemies: enemies.map(e => ({...e})),
              projectiles: [],
              score: 0, steps: 0, rewardSum: 0,
              episode: episode,
              done: false,
              health: 100, shield: 100, level: level, invulnTimer: 0,
              epsilon: epsilon
            });
          }
        } else if (data.cmd === 'params') {
          if (data.alpha !== undefined) alpha = data.alpha;
          if (data.epsilon !== undefined) epsilon = data.epsilon;
          if (data.gamma !== undefined) gamma = data.gamma;
        } else if (data.cmd === 'getLogs') {
          self.postMessage({ type: 'logs', logs });
        } else if (data.cmd === 'reset') {
          episode = 0; logs = []; level = 1; episodeSuccess = false; isFreeMode = false; reset();
        } else if (data.cmd === 'setLevel') {
          currentSegments = data.segments;
          isClosed = data.isClosed;
          episodeSuccess = false;
          reset();
        } else if (data.cmd === 'set_level_num') {
          level = data.level;
          isFreeMode = true;
          episodeSuccess = false;
          reset();
        } else if (data.cmd === 'start_export') {
          exportMode = true;
          isFreeMode = false;
          level = 1;
          episodeSuccess = false;
          exportResults = [];
          reset();
        } else if (data.cmd === 'start_normal') {
          exportMode = false;
          isFreeMode = false;
          level = 1;
          reset();
        } else if (data.cmd === 'input') {
          humanLeft = data.left;
          humanRight = data.right;
          humanFire = data.fire;
        }
      };
    `;

    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = function(e) {
      const data = e.data;
      if (data.type === 'state') {
        displayStats.episode = data.episode;
        displayStats.score = data.score;
        displayStats.steps = data.steps;
        displayStats.reward = data.rewardSum;
        displayStats.epsilon = data.epsilon;
        displayStats.health = data.health;
        displayStats.shield = data.shield;
        displayStats.level = data.level;
        updateDashboard();

        playerSegmentTarget = data.playerSegment;

        // VFX: Enemy Death
        const newEnemies = data.enemies;
        if (previousEnemiesData.length > newEnemies.length) {
            const destroyed = previousEnemiesData.filter(pe => {
                return !newEnemies.some(ne => 
                    Math.abs(ne.segment - pe.segment) < 0.1 && 
                    Math.abs(ne.depth - pe.depth) < 1.0 && 
                    ne.type === pe.type
                );
            });
            destroyed.forEach(d => {
                const pos = getTubePosition(d.segment, d.depth);
                const color = d.type === 2 ? COL_MAGENTA : (d.type % 2 === 0 ? COL_RED : COL_GREEN);
                spawnVFX(pos.x, pos.y, pos.z, color, 1.5, 'explosion');
            });
        }
        previousEnemiesData = newEnemies.map(e => ({...e}));

        // VFX: Player Damage
        if (data.health < prevHealth || data.shield < prevShield) {
            const pPos = getTubePosition(playerSegmentCurrent, 10);
            spawnVFX(pPos.x, pPos.y, pPos.z, COL_RED, 2.5, 'explosion');
        }
        prevHealth = data.health;
        prevShield = data.shield;

        // VFX: Muzzle Flash
        if (data.projectiles.length > previousProjectilesData.length) {
            const pPos = getTubePosition(playerSegmentCurrent, 5);
            spawnVFX(pPos.x, pPos.y, pPos.z, COL_YELLOW, 0.8, 'explosion');
        }
        previousProjectilesData = data.projectiles.map(p => ({...p}));

        // Update Meshes
        while (enemies.length) {
          let m = enemies.pop();
          scene.remove(m);
          disposeObject(m);
        }
        data.enemies.forEach(e => {
          const mesh = createEnemyMesh(e.segment, e.depth, e.type);
          enemies.push(mesh);
        });

        while (projectiles.length) {
          let m = projectiles.pop();
          scene.remove(m);
          disposeObject(m);
        }
        data.projectiles.forEach(p => {
          const mesh = createProjectileMesh(p.segment, p.depth);
          projectiles.push(mesh);
        });

        document.getElementById('combatScore').innerText = data.score;
        document.getElementById('enemyCount').innerText = data.enemies.length;
        document.getElementById('levelCount').innerText = data.level;
        document.getElementById('healthFill').style.width = data.health + '%';
        document.getElementById('shieldFill').style.width = data.shield + '%';

        if (data.level !== currentRenderedLevel) {
          const shapeId = ((data.level - 1) % 16) + 1;
          changeLevel(shapeId, data.level);
        }
      } else if (data.type === 'logs' || data.type === 'export_done') {
        const logBlob = new Blob([JSON.stringify(data.results || data.logs, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(logBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tempest_2k26_${data.type}_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        if (data.type === 'export_done') alert("Export Run Complete! Logs downloaded.");
      }
    };

    let previousEnemiesData = [];
    let previousProjectilesData = [];

    function updateDashboard() {
      document.getElementById('episodeVal').innerText = displayStats.episode;
      document.getElementById('scoreVal').innerText = displayStats.score;
      document.getElementById('stepsVal').innerText = displayStats.steps;
      document.getElementById('rewardVal').innerText = displayStats.reward.toFixed(2);
      document.getElementById('epsilonVal').innerText = displayStats.epsilon.toFixed(2);
    }

    // UI Bindings
    const sel = document.getElementById('levelSelect');
    for(let i=1; i<=16; i++) {
      let opt = document.createElement('option');
      opt.value = i;
      opt.innerText = LevelGenerators[i].name;
      sel.appendChild(opt);
    }
    
    sel.addEventListener('change', (e) => {
      const val = parseInt(e.target.value);
      worker.postMessage({ cmd: 'set_level_num', level: val });
      changeLevel(val, val);
    });

    document.getElementById('lrSlider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('lrDisplay').innerText = val.toFixed(2);
      worker.postMessage({ cmd: 'params', alpha: val });
    });
    document.getElementById('gammaSlider').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('gammaDisplay').innerText = val.toFixed(2);
      worker.postMessage({ cmd: 'params', gamma: val });
    });

    let paused = false;
    let timeScale = 50;
    document.getElementById('timeSlider').addEventListener('input', (e) => {
      timeScale = parseInt(e.target.value);
      document.getElementById('timeDisplay').innerText = timeScale + 'ms';
    });
    
    // FX Level Slider Logic - Completely Seamless
    document.getElementById('fxSlider').addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      fxLevel = val / 100;
      let txt = "MAX";
      if (val === 0) txt = "FAST";
      else if (val < 33) txt = "LOW";
      else if (val < 66) txt = "MID";
      else if (val < 100) txt = "HIGH";
      document.getElementById('fxDisplay').innerText = txt;
      
      // Toggle dust particles visibility based on FX level
      if (dustParticles) dustParticles.visible = fxLevel > 0.2;
    });
    
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    
    playBtn.addEventListener('click', () => {
      paused = false;
      playBtn.classList.add('active');
      pauseBtn.classList.remove('active');
    });
    pauseBtn.addEventListener('click', () => {
      paused = true;
      pauseBtn.classList.add('active');
      playBtn.classList.remove('active');
    });
    document.getElementById('stopBtn').addEventListener('click', () => {
      worker.postMessage({ cmd: 'reset' });
      paused = false;
      playBtn.classList.add('active');
      pauseBtn.classList.remove('active');
    });
    
    document.getElementById('exportBtn').addEventListener('click', () => {
      worker.postMessage({ cmd: 'getLogs' });
    });
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) gameContainer.requestFullscreen();
      else document.exitFullscreen();
    });

    // Hold-to-fire input listeners
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
      if (e.code === 'KeyD' || e.code === 'ArrowRight') { keys.right = true; e.preventDefault(); }
      if (e.code === 'Space' || e.code === 'KeyW') { keys.fire = true; e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'Space' || e.code === 'KeyW') keys.fire = false;
    });

    // Menu Logic
    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('mainMenu').classList.add('hidden');
      worker.postMessage({ cmd: 'start_normal' });
    });
    document.getElementById('freeModeBtn').addEventListener('click', () => {
      document.getElementById('mainMenu').classList.add('hidden');
      worker.postMessage({ cmd: 'set_level_num', level: 1 });
      changeLevel(1, 1);
      sel.value = 1;
    });
    document.getElementById('exportModeBtn').addEventListener('click', () => {
      document.getElementById('mainMenu').classList.add('hidden');
      worker.postMessage({ cmd: 'start_export' });
    });

    // Game Loop with dynamic timing
    function gameLoop() {
      if (!paused) {
        worker.postMessage({ cmd: 'step' });
        worker.postMessage({ cmd: 'input', ...keys });
      }
      setTimeout(gameLoop, timeScale);
    }
    
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const time = clock.getElapsedTime();

      // Update VFX
      for (let i = activeVFX.length - 1; i >= 0; i--) {
        activeVFX[i].update(dt);
        if (!activeVFX[i].isAlive) activeVFX.splice(i, 1);
      }

      // Spawn projectile trails (Only if FX level is high enough)
      if (fxLevel >= 0.5 && projectiles.length > 0 && Math.random() > 0.2) {
        projectiles.forEach(p => {
          spawnVFX(p.position.x, p.position.y, p.position.z, COL_WHITE, 0.4, 'trail');
        });
      }

      // Player movement lerp
      let diff = playerSegmentTarget - playerSegmentCurrent;
      if (currentLevelConfig && currentLevelConfig.isClosed) {
        if (Math.abs(diff) > currentLevelPoints.length / 2) {
          if (diff > 0) playerSegmentCurrent -= 0.15;
          else playerSegmentCurrent += 0.15;
        } else {
          playerSegmentCurrent += diff * 0.15;
        }
        playerSegmentCurrent = (playerSegmentCurrent + currentLevelPoints.length) % currentLevelPoints.length;
      } else {
        playerSegmentCurrent += diff * 0.15;
        playerSegmentCurrent = Math.max(0, Math.min(currentLevelPoints.length - 1, playerSegmentCurrent));
      }

      if (player && currentLevelPoints.length > 0) {
        const pos = getTubePosition(playerSegmentCurrent, 10); 
        player.position.lerp(pos, 0.2);
        
        if (currentLevelConfig && currentLevelConfig.isClosed) {
          const angle = (playerSegmentCurrent / currentLevelPoints.length) * Math.PI * 2;
          player.rotation.z = -angle - Math.PI / 2;
        } else {
          player.rotation.z = 0;
        }
        player.rotation.y = Math.sin(time * 5) * 0.05;
        
        if (playerCore) {
          const pulse = 1 + Math.sin(time * 10) * 0.3;
          playerCore.scale.set(pulse, pulse, pulse);
          playerCore.material.opacity = 0.7 + Math.sin(time * 10) * 0.3;
        }
      }

      enemies.forEach(e => {
        e.rotation.x += 0.02;
        e.rotation.y += 0.02;
      });

      // Camera Shake
      if (cameraShakeDuration > 0) {
        cameraShakeDuration -= dt;
        const shakeX = (Math.random() - 0.5) * cameraShakeIntensity * 10;
        const shakeY = (Math.random() - 0.5) * cameraShakeIntensity * 10;
        camera.position.x = (player.position.x * 0.1) + shakeX;
        camera.position.y = (50 + player.position.y * 0.1) + shakeY;
        cameraShakeIntensity *= 0.9;
      } else {
        camera.position.x += (player.position.x * 0.1 - camera.position.x) * 0.05;
        camera.position.y += (50 + player.position.y * 0.1 - camera.position.y) * 0.05;
      }
      camera.lookAt(0, 0, -100);

      if (dustParticles) dustParticles.rotation.y = time * 0.02;

      // Render Logic (Switch between Composer and Standard Renderer based on FX Level)
      if (useBloom && fxLevel > 0.3) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    window.addEventListener('load', () => {
      initThree();
      animate();
      gameLoop();
    });
  </script>
</body>
</html>
