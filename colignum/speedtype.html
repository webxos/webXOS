<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colignum: Speedtype, a Simple Typing Speed Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-top: 0;
            font-size: 24px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #4f46e5;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .stat-box {
            background-color: #f8fafc;
            padding: 12px 20px;
            border-radius: 8px;
            width: 40%;
            border: 1px solid #edf2f7;
        }
        .stat-val {
            font-size: 28px;
            font-weight: bold;
            color: #4f46e5;
            display: block;
        }
        .stat-lbl {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button {
            margin-top: 20px;
            background-color: #64748b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Colignum: Speedtype</h1>
    <p>Start typing below. The clock starts automatically on your first keystroke!</p>
    
    <textarea id="input-field" placeholder="Type your text here..."></textarea>
    
    <div class="stats">
        <div class="stat-box">
            <span id="wpm" class="stat-val">0</span>
            <span class="stat-lbl">Words / Min</span>
        </div>
        <div class="stat-box">
            <span id="cpm" class="stat-val">0</span>
            <span class="stat-lbl">Chars / Min</span>
        </div>
    </div>
    
    <button id="reset-btn">Reset</button>
</div>

<script>
    const inputField = document.getElementById('input-field');
    const wpmDisplay = document.getElementById('wpm');
    const cpmDisplay = document.getElementById('cpm');
    const resetBtn = document.getElementById('reset-btn');

    let startTime = null;
    let timerInterval = null;

    inputField.addEventListener('input', () => {
        const text = inputField.value;
        
        // Start the timer on the very first character typed
        if (!startTime && text.length > 0) {
            startTime = new Date().getTime();
            timerInterval = setInterval(updateStats, 100);
        }

        // Stop calculation if text is completely cleared
        if (text.length === 0) {
            resetTracker();
        }
    });

    function updateStats() {
        const text = inputField.value;
        if (text.length === 0 || !startTime) return;

        const currentTime = new Date().getTime();
        const timeElapsedMinutes = (currentTime - startTime) / 60000; // Convert ms to minutes

        if (timeElapsedMinutes > 0) {
            // Standard WPM convention counts 5 characters as 1 word
            const wordCount = text.length / 5;
            const charCount = text.length;

            const wpm = Math.round(wordCount / timeElapsedMinutes);
            const cpm = Math.round(charCount / timeElapsedMinutes);

            wpmDisplay.textContent = wpm;
            cpmDisplay.textContent = cpm;
        }
    }

    function resetTracker() {
        clearInterval(timerInterval);
        startTime = null;
        timerInterval = null;
        wpmDisplay.textContent = '0';
        cpmDisplay.textContent = '0';
    }

    resetBtn.addEventListener('click', () => {
        inputField.value = '';
        resetTracker();
        inputField.focus();
    });
</script>

</body>
</html>
