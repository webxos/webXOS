<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Cellular Automata — Computable Universes</title>
<style>
  :root {
    --bg: #0b0b0b;
    --panel: #141414;
    --panel-2: #1b1b1b;
    --line: #2a2a2a;
    --text: #e6e6e6;
    --dim: #8a8a8a;
    --dim-2: #5c5c5c;
    --accent: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 1200px;
    max-width: 100%;
    display: flex;
    gap: 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75);
  }

  /* ---------------- Sidebar ---------------- */

  .sidebar {
    flex: 0 0 300px;
    width: 300px;
    max-height: 552px;
    overflow-y: auto;
    padding-right: 16px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: #333 #111;
  }

  .sidebar::-webkit-scrollbar { width: 8px; }
  .sidebar::-webkit-scrollbar-track { background: #101010; border-radius: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  .sidebar::-webkit-scrollbar-thumb:hover { background: #444; }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--accent);
  }

  h3 {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim-2);
    margin: 0;
  }

  p {
    margin: 6px 0 0;
    font-size: 0.78rem;
    line-height: 1.55;
    color: var(--dim);
  }

  hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 2px 0;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--dim-2);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    user-select: none;
  }

  label .val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
    color: var(--accent);
  }

  select {
    width: 100%;
    padding: 8px 10px;
    background: #1e1e1e;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    outline: none;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  select:hover { border-color: #3d3d3d; }
  select:focus { border-color: #555; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: #2e2e2e;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    margin: 4px 0;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: var(--accent);
    border: none;
    cursor: pointer;
    transition: transform 0.12s;
  }

  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }

  input[type="range"]::-moz-range-track {
    height: 4px;
    background: #2e2e2e;
    border-radius: 2px;
  }

  .rule-info {
    background: #101010;
    border-left: 2px solid var(--accent);
    border-radius: 0 4px 4px 0;
    padding: 9px 11px;
    font-size: 0.76rem;
    line-height: 1.55;
    color: #b4b4b4;
    min-height: 58px;
  }

  .rule-info strong { color: var(--accent); font-weight: 600; }

  .btn-row {
    display: flex;
    gap: 8px;
  }

  button {
    flex: 1;
    padding: 9px 8px;
    background: #1e1e1e;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-family: inherit;
  }

  button:hover { background: #262626; border-color: #3d3d3d; }
  button:active { background: #303030; }

  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--dim);
    cursor: pointer;
  }

  .check input {
    accent-color: #ffffff;
    width: 14px;
    height: 14px;
    cursor: pointer;
  }

  /* ---------------- Main ---------------- */

  .main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #canvas-container {
    position: relative;
    width: 100%;
    height: 510px;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  #canvas-container.dragging { cursor: grabbing; }

  #caCanvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .stats-bar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: var(--dim-2);
    padding: 0 2px;
  }

  .stats-bar .hi { color: #9a9a9a; }

  @media (max-width: 980px) {
    body { padding: 12px; align-items: flex-start; }
    .app { flex-direction: column; }
    .sidebar {
      flex: 1 1 auto;
      width: 100%;
      max-height: 300px;
      padding-right: 0;
      padding-bottom: 16px;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    #canvas-container { height: 420px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ======================= SIDEBAR ======================= -->
  <aside class="sidebar">

    <header>
      <h1>Computable Universes</h1>
      <p>Stephen Wolfram's elementary cellular automata, extruded into a
         monochrome 3D spacetime block.</p>
    </header>

    <section class="control-group">
      <label for="rule-select">Wolfram Rule <span class="val" id="rule-val">030</span></label>
      <select id="rule-select"></select>
      <div class="rule-info" id="rule-desc"></div>
    </section>

    <section class="control-group">
      <label for="seed-select">Initial Seed</label>
      <select id="seed-select">
        <option value="center">Single centre cell</option>
        <option value="twin">Twin seeds</option>
        <option value="random">Random noise</option>
        <option value="alternating">Alternating stripe</option>
      </select>
    </section>

    <hr />

    <h3>3D Geometry Matrix</h3>

    <div class="control-group">
      <label for="pitch-slider">Isometric Pitch <span class="val" id="pitch-val">55°</span></label>
      <input type="range" id="pitch-slider" min="10" max="89" step="1" value="55" />
    </div>

    <div class="control-group">
      <label for="yaw-slider">Isometric Yaw <span class="val" id="yaw-val">325°</span></label>
      <input type="range" id="yaw-slider" min="0" max="360" step="1" value="325" />
    </div>

    <div class="control-group">
      <label for="extrude-slider">Spacetime Extrusion <span class="val" id="extrude-val">2.0×</span></label>
      <input type="range" id="extrude-slider" min="0.2" max="8" step="0.1" value="2" />
    </div>

    <div class="control-group">
      <label for="zoom-slider">Mass Scale (Voxel Zoom) <span class="val" id="zoom-val">1.00×</span></label>
      <input type="range" id="zoom-slider" min="0.4" max="4" step="0.05" value="1" />
    </div>

    <div class="control-group">
      <label for="steps-slider">Generations (Depth) <span class="val" id="steps-val">60</span></label>
      <input type="range" id="steps-slider" min="20" max="150" step="1" value="60" />
    </div>

    <hr />

    <div class="btn-row">
      <button type="button" id="btn-reroll">Re-roll Seed</button>
      <button type="button" id="btn-reset">Reset View</button>
    </div>

    <label class="check" for="autorotate">
      <input type="checkbox" id="autorotate" /> Auto-orbit
    </label>

    <p style="color:#4d4d4d;">Drag anywhere on the canvas to orbit the
       spacetime block. Scroll the sidebar for more controls.</p>

  </aside>

  <!-- ======================= MAIN ======================= -->
  <main class="main">
    <div id="canvas-container">
      <canvas id="caCanvas"></canvas>
    </div>
    <div class="stats-bar">
      <span id="stat-left">Render target: —</span>
      <span id="stat-right" class="hi">—</span>
    </div>
  </main>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     CONSTANTS
     ============================================================ */

  var DEG = Math.PI / 180;

  var NB = 96;                 // depth buckets for painter's algorithm
  var MAX_COLS = 501;          // noise-buffer width (grid width is capped by rows*2+1 ≤ 301)
  var MIN_PITCH = 10;          // degrees (avoid degenerate edge-on view)
  var MAX_PITCH = 89;          // degrees (90° would collapse pillars to zero length)

  /* ------------------------------------------------------------
     Rule descriptions.

     Each entry is accurate for the DEFAULT seed (single centre
     cell) unless explicitly noted. Bit convention:
       bits[i] = (rule >> i) & 1
       i = 4·left + 2·centre + right
     ------------------------------------------------------------ */
  var RULE_INFO = {
    0:   "Total extinction — every neighbourhood maps to a dead cell. The universe empties in a single step.",
    1:   "Only the empty neighbourhood gives birth, so a single seed triggers a near-full flood (all except the seed and its two neighbours). The state then collapses back to the original single cell, and the two phases alternate with period 2.",
    2:   "A single live cell that marches one step to the left every generation, wrapping around at the grid edge.",
    3:   "A period-2 oscillator: a nearly-full grid with a two-cell dead notch alternates with a single live cell. The whole pattern drifts one cell to the right per cycle.",
    4:   "A frozen single cell. Only the isolated 010 neighbourhood survives, so the centre seed is preserved and nothing else ever appears.",
    5:   "A period-2 oscillator: a single live cell alternates with a nearly-full grid missing the two cells adjacent to it.",
    6:   "A brief two-cell flare that immediately collapses into a single cell marching left, one step per generation.",
    8:   "Instant extinction from a single seed. Only the 011 neighbourhood survives, so even two-cell blocks collapse to a single cell within one step and then die.",
    18:  "Nested self-similar triangles — one of the simplest fractals in the elementary rule space.",
    22:  "Fractal skeleton with chaotic fringes. A Class 3 rule that never quite settles down.",
    28:  "Chaotic with a strong rightward drift and a thin fractal edge on the left flank.",
    30:  "Class 3 chaos. Aperiodic and statistically random — Wolfram used this rule as the random-number generator behind Mathematica.",
    45:  "Chaotic and asymmetric, with a fractal left margin and a turbulent interior.",
    54:  "Class 4 — a mix of stable, periodic and chaotic regions that can support localised structures.",
    60:  "XOR of the left and centre cells. Produces a clean right-leaning Sierpinski triangle.",
    62:  "Class 3 chaos with a periodic left edge and a turbulent body.",
    73:  "Nested fractal with mirrored triangular voids. The empty neighbourhood also lives, so a single seed briefly floods the background before collapsing back into a sparse symmetric motif.",
    75:  "Chaotic with a strong leftward drift and fractal edges. The empty neighbourhood also lives, so a single seed briefly floods the background before settling into leftward-moving chaos.",
    86:  "The exact mirror image of Rule 30. Class 3 chaos with a fractal fringe; its periodic striped flank sits on the opposite side to Rule 30's.",
    89:  "Chaotic with a fractal margin on the left; the body drifts right. The empty neighbourhood also lives, so a single seed briefly floods the background before the chaos organises.",
    90:  "The classic Sierpinski triangle: XOR of the left and right neighbours. A perfect self-similar fractal.",
    94:  "Symmetric fractal with chaotic edging. Self-mirror; the pattern stays balanced around the seed.",
    102: "XOR of the centre and right cells — a left-leaning Sierpinski triangle.",
    105: "The logical complement of Rule 150 (XNOR of all three neighbours). Produces an inverted Sierpinski fractal — a live background with a self-similar pattern of dead holes. Symmetric and self-mirror.",
    110: "Class 4 and provably Turing complete — given enough room it can emulate any computer.",
    122: "Self-mirror, Class 3. Grows a symmetric chaotic skeleton around the seed — no net drift.",
    126: "Class 3 chaos with mirrored fractal flanks.",
    129: "An inverted rule: empty neighbourhoods give birth, so a single seed floods the grid. A central dead notch then grows, splits and oscillates in a smooth wave.",
    137: "An inverted, asymmetric rule: empty neighbourhoods give birth, so a single seed floods the grid. A wandering dead notch forms around the seed and drifts left, leaving a chaotic asymmetric trace.",
    150: "XOR of all three neighbours. A symmetric, additive Sierpinski-like fractal.",
    151: "Live in every neighbourhood except those with exactly two live cells. A single seed fills the grid in one step and stays full.",
    153: "Not self-mirror. A near-full grid out of the single seed; a two-cell dead void then marches one step left per generation in a period-2 cycle.",
    160: "Instant extinction from a single seed. Only the 101 and 111 neighbourhoods survive, so the rule preserves patterns where the centre cell has live neighbours on both sides.",
    164: "Survives where the centre cell is isolated (010) or flanked on both sides (101, 111). From a single seed it freezes in place; nothing else appears.",
    169: "Asymmetric (mirror = 225). The empty neighbourhood lives, so a single seed floods the grid; a dead region then opens around the seed and migrates left, leaving an irregular, non-fractal trace.",
    182: "Self-mirror, Class 2. From a single seed it grows a solid symmetric triangle one cell per generation; with random seeds it settles into smooth drifting domains.",
    184: "Class 2 traffic model. Reproduces highway flow and surface deposition with clean diagonal bands. From a single seed, the cell simply marches one step to the right per generation.",
    190: "Dense asymmetric fractal with chaotic detail. Its mirror image is Rule 246.",
    193: "An inverted rule: the empty neighbourhood is born, so a single seed floods the grid. A three-cell dead notch forms near the seed and evolves chaotically.",
    210: "Chaotic turbulence behind a quasi-periodic left margin.",
    218: "Self-mirror. From random seeds, Class 3 chaos with a fractal skeleton. From the default single-cell seed, a symmetric self-similar fractal of scattered cells expands outward.",
    222: "Self-mirror. From random seeds, chaotic. From the default single-cell seed, a solid triangle of live cells expands outward one cell per side per generation.",
    225: "Dense chaotic turbulence with fractal edges. The empty neighbourhood also lives, so a single seed immediately floods the background.",
    232: "Majority-like rule — smooth uniform regions separated by chaotic boundaries. From the default single-cell seed no cell has two live neighbours, so the whole grid dies immediately — switch to Random noise to see the rule.",
    240: "Near-trivial shift behaviour. Class 1.",
    246: "Asymmetric chaotic turbulence. Its mirror image is Rule 190.",
    250: "Dense fractal with mirrored voids.",
    254: "Everything survives except the fully-dead neighbourhood, so a solid triangle of life grows one cell per generation; the far background ahead of the wavefront remains dead.",
    255: "Total life. Every neighbourhood maps to a live cell; the grid is instantly and permanently full."
  };

  var DEFAULT_DESC = "Elementary cellular automaton. Each row is generated from the one above it by applying the rule's 8-bit lookup table to every 3-cell neighbourhood.";

  /* ============================================================
     DOM REFERENCES
     ============================================================ */

  var canvas        = document.getElementById('caCanvas');
  var ctx           = canvas.getContext('2d', { alpha: false });
  var container     = document.getElementById('canvas-container');

  var ruleSelect    = document.getElementById('rule-select');
  var ruleVal       = document.getElementById('rule-val');
  var ruleDesc      = document.getElementById('rule-desc');
  var seedSelect    = document.getElementById('seed-select');

  var pitchSlider   = document.getElementById('pitch-slider');
  var yawSlider     = document.getElementById('yaw-slider');
  var extrudeSlider = document.getElementById('extrude-slider');
  var zoomSlider    = document.getElementById('zoom-slider');
  var stepsSlider   = document.getElementById('steps-slider');

  var pitchVal      = document.getElementById('pitch-val');
  var yawVal        = document.getElementById('yaw-val');
  var extrudeVal    = document.getElementById('extrude-val');
  var zoomVal       = document.getElementById('zoom-val');
  var stepsVal      = document.getElementById('steps-val');

  var statLeft      = document.getElementById('stat-left');
  var statRight     = document.getElementById('stat-right');

  var btnReroll     = document.getElementById('btn-reroll');
  var btnReset      = document.getElementById('btn-reset');
  var autoRotateChk = document.getElementById('autorotate');

  /* ============================================================
     STATE
     ============================================================ */

  var state = {
    rule: 30,
    seedMode: 'center',
    pitch: 55,        // degrees, elevation of the camera
    yaw: 325,         // degrees, azimuth ∈ [0, 360)
    extrude: 2.0,     // pillar height in world units (1 unit = 1 cell)
    zoom: 1.0,        // user zoom multiplier on top of auto-fit
    steps: 60,        // number of generations (rows)
    autoRotate: false
  };

  var cssW = 840;
  var cssH = 510;
  var dpr = 1;

  var needsRender = true;
  var isDragging = false;
  var lastPointerX = 0;
  var lastPointerY = 0;

  /* ============================================================
     DETERMINISTIC NOISE (seeded PRNG)
     ============================================================ */

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var noiseCache = { salt: null, row: null };

  function noiseRow(salt) {
    if (noiseCache.salt !== salt) {
      var rnd = mulberry32(0x1234567 ^ Math.imul(salt, 0x9E3779B1));
      var row = new Uint8Array(MAX_COLS);
      for (var i = 0; i < MAX_COLS; i++) row[i] = rnd() < 0.5 ? 1 : 0;
      noiseCache = { salt: salt, row: row };
    }
    return noiseCache.row;
  }

  /* ============================================================
     CELLULAR AUTOMATON ENGINE
     ============================================================ */

  var gridCache = null;
  var gridKey = '';
  var gridCols = 0;
  var gridRows = 0;
  var liveCount = 0;
  var seedSalt = 0;

  function buildGrid() {
    var rows = state.steps;
    var cols = Math.min(MAX_COLS, rows * 2 + 1);
    var key = state.rule + '|' + rows + '|' + cols + '|' + state.seedMode + '|' + seedSalt;

    if (gridCache && key === gridKey) return gridCache;

    var bits = new Uint8Array(8);
    for (var i = 0; i < 8; i++) bits[i] = (state.rule >> i) & 1;

    var g = new Uint8Array(rows * cols);
    var mid = (cols - 1) >> 1;
    var c;

    switch (state.seedMode) {
      case 'random': {
        var nr  = noiseRow(seedSalt);
        var off = (MAX_COLS - cols) >> 1;   // keep noise centred on the seed column
        for (c = 0; c < cols; c++) g[c] = nr[off + c];
        break;
      }
      case 'alternating':
        for (c = 0; c < cols; c++) g[c] = c & 1;
        break;
      case 'twin':
        g[mid - 5] = 1;
        g[mid + 5] = 1;
        break;
      case 'center':
      default:
        g[mid] = 1;
        break;
    }

    var last = cols - 1;
    for (var r = 0; r < rows - 1; r++) {
      var cur = r * cols;
      var nxt = cur + cols;
      for (c = 0; c < cols; c++) {
        var l = g[cur + (c === 0 ? last : c - 1)];
        var m = g[cur + c];
        var rr = g[cur + (c === last ? 0 : c + 1)];
        g[nxt + c] = bits[(l << 2) | (m << 1) | rr];
      }
    }

    var alive = 0;
    for (var k = 0, len = g.length; k < len; k++) if (g[k]) alive++;

    gridCache = g;
    gridKey = key;
    gridCols = cols;
    gridRows = rows;
    liveCount = alive;

    return g;
  }

  /* ============================================================
     RENDER BUFFERS (reused every frame, no per-frame allocation)
     ============================================================ */

  var bufCap = 0;
  var aX = null, aTop = null, aBot = null, aDep = null, aOrder = null;

  var counts = new Int32Array(NB + 1);
  var starts = new Int32Array(NB);

  function ensureCapacity(n) {
    if (n <= bufCap) return;
    var newCap = Math.max(n, 2048);
    aX     = new Float32Array(newCap);
    aTop   = new Float32Array(newCap);
    aBot   = new Float32Array(newCap);
    aDep   = new Float32Array(newCap);
    aOrder = new Int32Array(newCap);
    bufCap = newCap;
  }

  /* ============================================================
     RENDERER
     ============================================================ */

  var lastRenderMs = 0;

  function render() {
    var t0 = (window.performance && performance.now) ? performance.now() : 0;

    var W = cssW;
    var H = cssH;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    var g = buildGrid();
    var rows = gridRows;
    var cols = gridCols;

    /* ---- camera basis -------------------------------------- */
    var yawR = state.yaw * DEG;
    var pitchR = state.pitch * DEG;

    var ca = Math.cos(yawR), sa = Math.sin(yawR);
    var ce = Math.cos(pitchR), se = Math.sin(pitchR);

    var halfW = cols / 2;
    var halfH = rows / 2;
    var maxZ = state.extrude;

    /* ---- auto-fit: project the 8 corners of the world box --- */
    var minX = Infinity, maxX = -Infinity;
    var minY = Infinity, maxY = -Infinity;

    for (var i = 0; i < 8; i++) {
      var nx = (i & 1) ? halfW : -halfW;
      var ny = (i & 2) ? halfH : -halfH;
      var nz = (i & 4) ? maxZ : 0;

      var x1 = nx * ca + ny * sa;
      var y1 = -nx * sa + ny * ca;

      var sX = x1;
      var sY = -y1 * se - nz * ce;

      if (sX < minX) minX = sX;
      if (sX > maxX) maxX = sX;
      if (sY < minY) minY = sY;
      if (sY > maxY) maxY = sY;
    }

    var bw = Math.max(maxX - minX, 1e-6);
    var bh = Math.max(maxY - minY, 1e-6);

    var scale = Math.min(W * 0.92 / bw, H * 0.92 / bh) * state.zoom;

    var cX = (minX + maxX) * 0.5;
    var cY = (minY + maxY) * 0.5;

    var ox = W * 0.5 - cX * scale;
    var oy = H * 0.5 - cY * scale;

    /* ---- gather every live cell ----------------------------- */
    ensureCapacity(rows * cols);

    var n = 0;
    var midZ = maxZ * 0.5;

    for (var r = 0; r < rows; r++) {
      var nyy = r - halfH;
      var rowOff = r * cols;

      // hoisted row-invariant terms
      var rowSA = nyy * sa;
      var rowCA = nyy * ca;

      for (var c = 0; c < cols; c++) {
        if (g[rowOff + c] === 0) continue;

        var nxx = c - halfW;

        var x1c = nxx * ca + rowSA;
        var y1c = -nxx * sa + rowCA;

        aX[n]   = ox + x1c * scale;
        aTop[n] = oy + (-y1c * se - maxZ * ce) * scale;
        aBot[n] = oy + (-y1c * se) * scale;
        aDep[n] = y1c * ce - midZ * se;

        n++;
      }
    }

    /* ---- depth-sort with a counting sort (O(n)) ------------- */
    if (n > 0) {
      var dmin = Infinity, dmax = -Infinity;
      for (var q = 0; q < n; q++) {
        var d = aDep[q];
        if (d < dmin) dmin = d;
        if (d > dmax) dmax = d;
      }

      var span = dmax - dmin;
      var usable = span > 1e-6;
      var inv = usable ? (NB - 1) / span : 0;

      counts.fill(0);

      for (var q2 = 0; q2 < n; q2++) {
        var b0 = usable ? ((aDep[q2] - dmin) * inv) | 0 : 0;
        if (b0 < 0) b0 = 0; else if (b0 >= NB) b0 = NB - 1;
        counts[b0 + 1]++;
      }

      for (var b1 = 0; b1 < NB; b1++) counts[b1 + 1] += counts[b1];

      for (var b2 = 0; b2 < NB; b2++) starts[b2] = counts[b2];

      for (var q3 = 0; q3 < n; q3++) {
        var b3 = usable ? ((aDep[q3] - dmin) * inv) | 0 : 0;
        if (b3 < 0) b3 = 0; else if (b3 >= NB) b3 = NB - 1;
        aOrder[starts[b3]++] = q3;
      }

      /* ---- paint far → near -------------------------------- */
      var size    = Math.max(scale, 1);
      var capHalf = Math.max(size * 0.44, 0.5);

      ctx.lineCap  = 'round';
      ctx.lineJoin = 'miter';
      ctx.lineWidth = size;

      for (var bk = NB - 1; bk >= 0; bk--) {
        var s = counts[bk];
        var e = counts[bk + 1];
        if (s === e) continue;

        var t  = (NB > 1) ? bk / (NB - 1) : 0;   // 0 = nearest, 1 = farthest
        var v  = Math.round(255 - t * 205);      // fog ramp
        var bv = Math.round(v * 0.42);

        // pillar bodies
        ctx.beginPath();
        for (var k1 = s; k1 < e; k1++) {
          var idx1 = aOrder[k1];
          var px1 = aX[idx1];
          ctx.moveTo(px1, aBot[idx1]);
          ctx.lineTo(px1, aTop[idx1]);
        }
        ctx.strokeStyle = 'rgb(' + bv + ',' + bv + ',' + bv + ')';
        ctx.stroke();

        // top caps
        ctx.beginPath();
        for (var k2 = s; k2 < e; k2++) {
          var idx2 = aOrder[k2];
          ctx.rect(aX[idx2] - capHalf, aTop[idx2] - capHalf, capHalf * 2, capHalf * 2);
        }
        ctx.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
        ctx.fill();
      }
    }

    /* ---- stats --------------------------------------------- */
    if (t0) {
      var ms = (performance.now() - t0);
      lastRenderMs = (lastRenderMs === 0) ? ms : (lastRenderMs * 0.85 + ms * 0.15);
    }

    statLeft.textContent =
      'Render ' + cssW + '×' + cssH +
      '  ·  grid ' + cols + '×' + rows +
      '  ·  live cells ' + liveCount;

    statRight.textContent =
      'Rule ' + String(state.rule).padStart(3, '0') +
      '  ·  ' + lastRenderMs.toFixed(1) + ' ms';
  }

  /* ============================================================
     CANVAS SIZING
     ============================================================ */

  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width));
    var h = Math.max(1, Math.round(rect.height));

    var newDpr = Math.min(window.devicePixelRatio || 1, 2);

    if (w === cssW && h === cssH && newDpr === dpr &&
        canvas.width === Math.round(w * dpr)) {
      return;
    }

    cssW = w;
    cssH = h;
    dpr = newDpr;

    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);

    needsRender = true;
  }

  /* ============================================================
     UI WIRING
     ============================================================ */

  // ---- populate the 256 rules ---------------------------------
  (function populateRules() {
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 256; i++) {
      var opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = 'Rule ' + String(i).padStart(3, '0');
      if (i === 30) opt.selected = true;
      frag.appendChild(opt);
    }
    ruleSelect.appendChild(frag);
  })();

  function updateRuleInfo() {
    var d = RULE_INFO[state.rule];
    ruleDesc.innerHTML =
      '<strong>Rule ' + String(state.rule).padStart(3, '0') + ':</strong> ' +
      (d ? d : DEFAULT_DESC);
  }

  function setRule(v) {
    state.rule = Math.max(0, Math.min(255, v | 0));
    ruleVal.textContent = String(state.rule).padStart(3, '0');
    ruleSelect.value = String(state.rule);
    updateRuleInfo();
    needsRender = true;
  }

  function setYaw(v) {
    // wrap into [0, 360)
    var raw = v;
    v = ((v % 360) + 360) % 360;
    state.yaw = v;
    // Skip slider write when a wrap occurred: writing the wrapped value
    // would produce a visible handle teleport (360°→0° or 0°→360°).
    // The numeric readout still updates continuously.
    if (Math.abs(raw - v) < 0.5) {
      yawSlider.value = String(Math.round(v));
    }
    yawVal.textContent = Math.round(v) + '°';
  }

  function setPitch(v) {
    v = Math.max(MIN_PITCH, Math.min(MAX_PITCH, v));
    state.pitch = v;
    pitchSlider.value = String(Math.round(v));
    pitchVal.textContent = Math.round(v) + '°';
  }

  function setExtrude(v) {
    v = Math.max(0.2, Math.min(8, v));
    state.extrude = v;
    extrudeSlider.value = String(v);
    extrudeVal.textContent = v.toFixed(1) + '×';
  }

  function setZoom(v) {
    v = Math.max(0.4, Math.min(4, v));
    state.zoom = v;
    zoomSlider.value = String(v);
    zoomVal.textContent = v.toFixed(2) + '×';
  }

  function setSteps(v) {
    v = Math.max(20, Math.min(150, v | 0));
    state.steps = v;
    stepsSlider.value = String(v);
    stepsVal.textContent = String(v);
  }

  // ---- control listeners --------------------------------------
  ruleSelect.addEventListener('change', function () {
    setRule(parseInt(this.value, 10));
  });

  seedSelect.addEventListener('change', function () {
    state.seedMode = this.value;
    needsRender = true;
  });

  pitchSlider.addEventListener('input', function () {
    setPitch(parseFloat(this.value));
    needsRender = true;
  });

  yawSlider.addEventListener('input', function () {
    setYaw(parseFloat(this.value));
    needsRender = true;
  });

  extrudeSlider.addEventListener('input', function () {
    setExtrude(parseFloat(this.value));
    needsRender = true;
  });

  zoomSlider.addEventListener('input', function () {
    setZoom(parseFloat(this.value));
    needsRender = true;
  });

  stepsSlider.addEventListener('input', function () {
    setSteps(parseInt(this.value, 10));
    needsRender = true;
  });

  btnReroll.addEventListener('click', function () {
    if (state.seedMode !== 'random') {
      state.seedMode = 'random';
      seedSelect.value = 'random';
    }
    seedSalt++;
    needsRender = true;
  });

  btnReset.addEventListener('click', function () {
    setYaw(325);
    setPitch(55);
    setExtrude(2);
    setZoom(1);
    needsRender = true;
  });

  autoRotateChk.addEventListener('change', function () {
    state.autoRotate = this.checked;
    needsRender = true;
  });

  // ---- drag-to-orbit ------------------------------------------
  container.addEventListener('pointerdown', function (e) {
    isDragging = true;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    container.classList.add('dragging');
    if (container.setPointerCapture) {
      try { container.setPointerCapture(e.pointerId); } catch (err) {}
    }
    e.preventDefault();
  });

  container.addEventListener('pointermove', function (e) {
    if (!isDragging) return;

    var dx = e.clientX - lastPointerX;
    var dy = e.clientY - lastPointerY;

    lastPointerX = e.clientX;
    lastPointerY = e.clientY;

    setYaw(state.yaw - dx * 0.35);
    setPitch(state.pitch + dy * 0.35);

    needsRender = true;
    e.preventDefault();
  });

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    container.classList.remove('dragging');
    if (container.releasePointerCapture && e && e.pointerId !== undefined) {
      try { container.releasePointerCapture(e.pointerId); } catch (err) {}
    }
  }

  container.addEventListener('pointerup', endDrag);
  container.addEventListener('pointercancel', endDrag);
  container.addEventListener('lostpointercapture', function () {
    isDragging = false;
    container.classList.remove('dragging');
  });

  // block context menu / native drag inside the viewport
  container.addEventListener('dragstart', function (e) { e.preventDefault(); });
  container.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---- window resize ------------------------------------------
  window.addEventListener('resize', function () {
    resizeCanvas();
    needsRender = true;
  });

  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () {
      resizeCanvas();
      needsRender = true;
    });
    ro.observe(container);
  }

  /* ============================================================
     ANIMATION LOOP
     ============================================================ */

  function loop() {
    if (state.autoRotate && !isDragging) {
      setYaw(state.yaw + 0.35);
      needsRender = true;
    }

    if (needsRender) {
      render();
      needsRender = false;
    }

    requestAnimationFrame(loop);
  }

  /* ============================================================
     INIT
     ============================================================ */

  function init() {
    setRule(30);
    setPitch(55);
    setYaw(325);
    setExtrude(2);
    setZoom(1);
    setSteps(60);

    resizeCanvas();

    // second pass once layout has settled (fonts, scrollbars, etc.)
    setTimeout(function () {
      resizeCanvas();
      needsRender = true;
    }, 60);

    needsRender = true;
    requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>
</html>
